spring:
  sql:
    init:
      mode: always
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:threatguard;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  port: 8080
